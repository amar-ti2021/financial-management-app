name: CI

# Checks every pull request and every push to main. Deployment itself is done by
# Netlify's Git integration (production from main, deploy previews for PRs), which
# runs the same lint + build via netlify.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so new CVEs in unchanged dependencies still surface (Mon 01:00 UTC = 08:00 WIB).
  schedule:
    - cron: '0 1 * * 1'

# A newer push to the same branch or PR supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Scanners are official release binaries checked against these SHA-256s instead of
# third-party actions (trivy-action tags were hijacked in March 2026, GHSA-69fq-xp46-6x23).
# When bumping a version, copy the new hash from that release's *_checksums.txt.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every new commit can be scanned

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Just the commits this push/PR adds. Full history on manual and scheduled runs,
          # a new branch (before = 000…), or a force push whose old tip is gone.
          if [ -n "$BASE" ] && [[ ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            range="$HEAD"
          fi
          echo "Scanning commits: $range"
          # --redact: this repo is public, so findings must never print the secret itself.
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --verbose --no-banner

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy

      # Dev dependencies are included: Vite, Tailwind and TypeScript run in CI and on Netlify.
      # Fails only on HIGH/CRITICAL issues that already have a fix; accept a risk in .trivyignore.
      - name: Scan dependencies, secrets and config
        run: |
          "$RUNNER_TEMP/trivy" fs . \
            --scanners vuln,secret,misconfig \
            --include-dev-deps \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1
