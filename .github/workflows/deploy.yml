name: CI/CD

# Pull requests: lint + build, then a preview deploy at pr-<number>--<site>.netlify.app.
# Push to main: lint + build, then a production deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NETLIFY_CLI_VERSION: 27.12.1

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Netlify
    needs: ci
    runs-on: ubuntu-latest
    # Production only from main; previews only for PRs from this repo (fork PRs get no secrets).
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      # Checked out for netlify.toml (SPA redirect, cache headers) and .nvmrc.
      - uses: actions/checkout@v7

      # netlify-cli needs Node >= 22.13; don't rely on the runner's preinstalled version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check Netlify secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Set the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets (see README › Deployment)."
            exit 1
          fi

      - name: Deploy
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MESSAGE: ${{ github.event_name }} ${{ github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then target="--alias=pr-$PR_NUMBER"; else target="--prod"; fi
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy \
            --no-build --dir=dist $target --message="$MESSAGE" --json > deploy.json
          # Production deploys report `url`; previews only have `deploy_url`.
          url=$(jq -r '.url // .deploy_url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Netlify: $url" >> "$GITHUB_STEP_SUMMARY"
